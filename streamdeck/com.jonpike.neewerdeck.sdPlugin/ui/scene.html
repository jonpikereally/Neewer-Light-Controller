<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row">
  <label>Scene</label>
  <select name="scene" data-default="1">
    <option value="1">Lightning</option>
    <option value="2">Paparazzi</option>
    <option value="3">Defective Bulb</option>
    <option value="4">Explosion</option>
    <option value="5">Welding</option>
    <option value="6">CCT Flash</option>
    <option value="7">Hue Flash</option>
    <option value="8">CCT Pulse</option>
    <option value="9">Hue Pulse</option>
    <option value="10">Cop Car</option>
    <option value="11">Candlelight</option>
    <option value="12">Hue Loop</option>
    <option value="13">CCT Loop</option>
    <option value="14">Intensity Loop</option>
    <option value="15">TV Screen</option>
    <option value="16">Firework</option>
    <option value="17">Party</option>
  </select>
</div>
<div class="row">
  <label>Speed</label>
  <input type="range" name="speed" min="1" max="10" data-default="5"><output></output>
</div>
<p class="hint">The key lights up while its scene is the one running. Other scene settings come from the app’s Scene tab.</p>
<script src="pi.js"></script></body></html>
